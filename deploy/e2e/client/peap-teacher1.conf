# wpa_supplicant network block for eapol_test: PEAP-MSCHAPv2 as teacher1.
#
# The SSID the SERVER gates on is NOT set here — it is injected per case via
# eapol_test's -N30 (Called-Station-Id), which the server's
# rewrite_called_station_id splits into &Called-Station-SSID. This file only
# carries the credentials and the server-cert pinning.
#
# ca_cert + domain_suffix_match pin the EAP server certificate to the dedicated
# EAP CA and the SERVER_FQDN — the load-bearing defence for PEAP's weak inner
# MSCHAPv2 (docs/certs-and-ca.md §1). Present on every case so the pinning is
# exercised on every handshake, not just the happy path.
network={
	key_mgmt=WPA-EAP
	eap=PEAP
	identity="teacher1"
	password="Passw0rd!"
	phase2="auth=MSCHAPV2"
	ca_cert="/etc/eap/ca.pem"
	domain_suffix_match="radius.example.lmn"
}
