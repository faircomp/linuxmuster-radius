# wpa_supplicant network block for eapol_test: PEAP-MSCHAPv2 as nowifi1.
# nowifi1's password is CORRECT — the NT-hash validates — but the account is in
# NEITHER 'wifi' nor any role group, so the base gate
# (ntlm_auth --require-membership-of EXAMPLE\wifi, mods/mschap) fails and the
# request is rejected before the per-SSID policy is ever reached. That is what
# makes case 5 a proof of the BASE gate specifically.
# The SSID is injected per case via eapol_test -N30 (Called-Station-Id).
network={
	key_mgmt=WPA-EAP
	eap=PEAP
	identity="nowifi1"
	password="Passw0rd!"
	phase2="auth=MSCHAPV2"
	ca_cert="/etc/eap/ca.pem"
	domain_suffix_match="radius.example.lmn"
}
