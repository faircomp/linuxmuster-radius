# wpa_supplicant network block for eapol_test: PEAP-MSCHAPv2 as student1.
# The SSID is injected per case via eapol_test -N30 (Called-Station-Id); see
# peap-teacher1.conf for the pinning rationale.
network={
	key_mgmt=WPA-EAP
	eap=PEAP
	identity="student1"
	password="Passw0rd!"
	phase2="auth=MSCHAPV2"
	ca_cert="/etc/eap/ca.pem"
	domain_suffix_match="radius.example.lmn"
}
