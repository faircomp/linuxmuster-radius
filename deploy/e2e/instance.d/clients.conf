#
# linuxmuster-radius E2E — clients.conf (mounted read-only at
# /etc/lmnradius/instance.d/clients.conf; the image entrypoint $-INCLUDEs it and
# also appends its own healthcheck-loopback client, so define ONLY the NAS here).
#
# Shape mirrors image/templates/instance.d/clients.conf.example: one client{}
# per AP-management subnet. In the E2E the "AP" is the `client` service running
# eapol_test; its Access-Requests arrive from its container IP in 172.29.0.0/24.
#

client e2e-client-subnet {
	#  Matches the compose network (the eapol_test container sits at 172.29.0.30).
	ipaddr = 172.29.0.0/24

	#  Shared secret between the (fake) AP and this server. TEST-ONLY value.
	#  MUST equal deploy/e2e/secrets/radius.secret (eapol_test passes it via -s).
	secret = E2E-ONLY-radius-shared-secret-change-me

	#  Classic RADIUS over UDP.
	proto = udp

	#  eapol_test always includes Message-Authenticator on 802.1X requests, so
	#  requiring it (BlastRADIUS hardening, RFC 3579/5080) is safe here and
	#  matches the production shape.
	require_message_authenticator = yes

	shortname = e2e-client
}
