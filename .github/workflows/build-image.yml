# Build the data-plane FreeRADIUS image and push it to GHCR by tag + immutable digest.
# Pin that digest as DEFAULT_IMAGE (controlplane/lmnradius/models.py) in a reviewed PR; while
# Renovate is disabled (Kevin, 2026-09-25) that is done by hand.
# Every action is pinned by full commit SHA (`# vN` names the tag); raised by hand as well.
name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["image/**", ".github/workflows/build-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/linuxmuster-radius
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Report digest
        run: |
          echo "Published ghcr.io/${{ github.repository_owner }}/linuxmuster-radius"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          echo "Pin this digest as DEFAULT_IMAGE in controlplane/lmnradius/models.py (by hand while Renovate is disabled)."
