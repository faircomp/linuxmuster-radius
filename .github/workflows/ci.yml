#
# From linuxmusterDEV/templates/ci.yml. Three stages on every push/PR: the fast tier
# (lint/type/unit + shell + license compliance), the package build in the same
# container upstream CI uses (proves it builds on the target Ubuntu/Python), and an
# install smoke on ubuntu-24.04. The heavy winbind/EAP FreeRADIUS E2E runs on crabbox,
# not in GitHub CI.
#
# Supply chain (stage A, linuxmusterDEV work/plans/paketarchiv.md §2): every input of the
# build is pinned to an immutable reference, because a released .deb vouches for everything
# that ran in its build.
#  * Python dependencies from hash-pinned lockfiles (controlplane/*.lock, job `lockfile`).
#  * Build image by digest. ghcr.io/linuxmuster/lmndev-runner:<tag> is a mutable tag of
#    another org, rebuilt every week, and the build runs as root in it; `:<tag>@sha256:<digest>`
#    pulls exactly that image (the digest wins, the tag only tells Renovate which tag's digest
#    to follow). ci.yml, release.yml and the Makefile carry the SAME digests, or CI proves a
#    different build than the one that is released.
#  * Every action by full commit SHA with a `# vN` comment: a tag can be moved, a SHA cannot.
name: ci

on:
  # Only main and tags on push: every other branch is covered by its pull request,
  # so a PR branch does not run the whole pipeline twice.
  push:
    branches: [main]
    tags: ['v[0-9]*']       # the sanity checks run for releases too (release.yml only gates/builds)
  pull_request:
  workflow_dispatch:
    inputs:
      prev_tag:
        description: 'upgrade smoke: tag to upgrade from (empty = newest published release)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"        # = Ubuntu 24.04 / lmn73
      # The gate tools are PINNED on purpose: an unpinned `pip install ruff` picks up
      # whatever released last, and a linter that widens its default rule set turns the
      # pipeline red without a single line of our code changing (exactly what happened
      # on 2026-08-04). Pinned == the developer's local result == CI's result. Renovate
      # proposes bumps as PRs, so upgrading stays a deliberate, reviewed step.
      # The runtime dependencies come from the hash-pinned lockfile the .deb is built from,
      # installed AFTER the tools so no tool can move them: pytest and mypy see exactly
      # the versions that ship (and the ones a Renovate lockfile bump proposes), not
      # whatever PyPI serves today. pip check: the tools still fit the locked versions.
      - name: Install control-plane (locked dependencies) + tools
        run: |
          pip install \
            ruff==0.15.21 \
            mypy==2.2.0 \
            reuse==6.2.0 \
            pytest==9.1.1 \
            types-PyYAML==6.0.12.20260906 \
            pytest-asyncio
          pip install --require-hashes --only-binary :all: --no-deps -r controlplane/requirements.lock
          pip install --no-deps ./controlplane
          pip check
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy --config-file controlplane/pyproject.toml controlplane/lmnradius
      - name: pytest
        run: pytest -q controlplane/tests
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
            image/*.sh scripts/*.sh packaging/*.sh \
            packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
      - name: reuse (license compliance)
        run: reuse lint

  # build-deb.sh installs the lockfiles with --no-deps, so only this job notices a
  # dependency added to pyproject.toml without re-locking, a hand-edited pin or hash, or a
  # locked version without a wheel for the target (CPython 3.12, glibc 2.39, x86_64).
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Lockfiles match their sources, PyPI and the target platform
        run: |
          pip install uv==0.12.18
          bash scripts/check-lockfiles.sh

  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: image
        run: |
          DIST=$(dpkg-parsechangelog -S Distribution); NUM="${DIST#lmn}"
          # By digest, never by tag alone (see the header); Renovate proposes the bumps.
          if [ "${NUM:-0}" -ge 74 ] 2>/dev/null; then
            IMG=ghcr.io/linuxmuster/lmndev-runner:latest@sha256:d735e6ccc6fd9df71b2552b06ac6f5cb4bf2d03f40e14bafe47213325b7b801b
          else
            IMG=ghcr.io/linuxmuster/lmndev-runner:24.04@sha256:6b0c8ac994cf1d2da44b0b36ebd7b3b125094886e78293e04b9db5e515b8209e
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "version=$(dpkg-parsechangelog -S Version)" >> "$GITHUB_OUTPUT"

  package:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve.outputs.image }}
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build package (make deb wraps packaging/build-deb.sh)
        run: |
          # No debian/control at the root yet (that is the debian/ conversion PR), so
          # install what build-deb.sh needs by hand instead of `apt-get build-dep`.
          apt-get update -qq && apt-get install -y -qq python3-venv
          make deb
          mkdir -p output && mv ./linuxmuster-radius_*.deb output/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: output/
          if-no-files-found: error

  install-smoke:
    needs: package
    runs-on: ubuntu-24.04              # the target OS; the venv python must match
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      # Actually install the built package and use it the way the docs tell an admin
      # to. Building alone proved nothing about the installed layout: v0.1.0..v0.1.3
      # shipped without the CLI on PATH and no pipeline noticed.
      - name: Install and use the package like an admin would
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y ./packages/*.deb
          test "$(command -v lmnradius)" = /usr/bin/lmnradius
          sudo lmnradius --help >/dev/null
          # postinst enabled + started the service; the API must answer like the docs promise.
          ok=0
          for i in $(seq 1 30); do
            if sudo lmnradius health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            systemctl status linuxmuster-radius.service --no-pager || true
            sudo journalctl -u linuxmuster-radius.service --no-pager | tail -50 || true
            exit 1
          fi
          sudo lmnradius health
          # Single version source: the venv's package metadata equals the .deb version
          # (~rc -> rc in PEP 440). No `lmnradius version` command yet, so ask importlib.
          ver="$(dpkg-query -W -f='${Version}' linuxmuster-radius)"
          test "$(sudo /opt/linuxmuster-radius/venv/bin/python -c 'from importlib.metadata import version; print(version("lmnradius"))')" = "${ver//\~/}"

  # Kevin's rule: a release must still install cleanly ON TOP OF the version that is
  # already running on a school server. This job installs the newest published release,
  # puts realistic config/state in place, upgrades to the freshly built package and
  # checks that nothing was lost. It skips itself on the very first release.
  upgrade-smoke:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: read        # restrictive org defaults must not break the asset download
    steps:
      # needed for dpkg-parsechangelog and the fixtures
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packages
          path: packages/
      - name: Fetch the published release to upgrade from
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          # Through env, never interpolated into the script: a ${{ }} expression in a run
          # block is substituted before the shell sees it, so its content could inject code.
          PREV_TAG: ${{ github.event.inputs.prev_tag }}
        run: |
          set -eu
          mkdir -p previous
          tag="${PREV_TAG:-}"
          if [ -z "$tag" ]; then
            # Prefer the newest real release; fall back to the newest prerelease. Skipping is
            # only legitimate when the repo has NO release at all: this job gates the release
            # job, so a silent skip would publish a tag whose upgrade path was never tested.
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                    --json tagName,isDraft,isPrerelease \
                    --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName // ""')
            if [ -z "$tag" ]; then
              tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                      --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName // ""')
              [ -n "$tag" ] && echo "::warning::no full release yet, upgrading from prerelease $tag"
            fi
          fi
          if [ -z "$tag" ]; then
            if [ "$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq 'length')" != "0" ]; then
              echo "::error::releases exist but none could be selected - refusing to skip"; exit 1
            fi
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::first release of this package, nothing to upgrade from"
            exit 0
          fi
          for i in 1 2 3; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir previous && break
            echo "download attempt $i failed, retrying"; sleep 10
          done
          test -n "$(ls previous/*.deb 2>/dev/null)"
          echo "::notice::upgrading from $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install the released version, upgrade to the built one
        if: steps.prev.outputs.skip != '1'
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ./previous/*.deb

          # ---------------------------------------------------------------- state BEFORE
          # The state an admin has on a running server, created exactly the way
          # docs/install.md tells them to. The RELEASED version's CLI is driven from the
          # venv, not from /usr/bin: v0.1.0..v0.1.3 shipped without that symlink, and an
          # old prev_tag must not fall over a missing one. Everything goes through the
          # control-plane API, so wait for it first (the postinst starts the service).
          old_cli=/opt/linuxmuster-radius/venv/bin/lmnradius
          for _ in $(seq 1 30); do sudo "$old_cli" health >/dev/null 2>&1 && break; sleep 1; done
          sudo "$old_cli" health

          # install.md step 3 - the three secret files, owner lmnradius, mode 0600.
          for s in join.authfile ldap-bind.secret radius.secret; do
            printf 'ci-%s\n' "$s" | sudo tee "/etc/linuxmuster-radius/secrets/$s" >/dev/null
            sudo chown lmnradius:lmnradius "/etc/linuxmuster-radius/secrets/$s"
            sudo chmod 600 "/etc/linuxmuster-radius/secrets/$s"
          done

          # install.md step 4 - the EAP CA. Pure crypto: no DC, no Docker.
          sudo "$old_cli" ca init --passphrase ci

          # install.md step 5 - the instance record. `create` also reconciles and the
          # container cannot come up here (no DC), but Reconciler.apply() stores the
          # record and renders instance.d/ BEFORE Docker is touched and the EAP cert is
          # still missing at this point, so the call fails closed with 409 while leaving
          # exactly the state this job is about -- hence `|| true`, and hence `cert issue`
          # afterwards. The timeout is a ceiling for the image pull docker_service does
          # first, not a wait. ldap:// on purpose: from 7.3.1 on an ldaps:// instance must
          # pin a CA with --ldap-ca, a flag the older releases this job can upgrade from
          # (prev_tag=v0.1.6) do not have.
          # The fixture pins the data-plane image of the previous package line, i.e. what
          # an instance created by an earlier .deb still runs. It MUST differ from this
          # package's DEFAULT_IMAGE (asserted after the upgrade): update_all() skips every
          # instance that is already on the target, so with the default pinned the
          # postinst's update path would silently do nothing and the assertions below
          # would pass without it ever having run.
          fixture_image='ghcr.io/faircomp/linuxmuster-radius@sha256:2dd07e23e01b7f97614164266c68c60f96c2fcc0feac4cb1c2adf0a2ba7ad894'
          sudo timeout 300 "$old_cli" create --name ci \
            --image "$fixture_image" \
            --realm LINUXMUSTER.LAN --workgroup LINUXMUSTER \
            --server-fqdn radius.linuxmuster.lan \
            --ldap-server ldap://dc.linuxmuster.lan \
            --ldap-base-dn 'OU=SCHOOLS,DC=linuxmuster,DC=lan' \
            --ldap-bind-dn 'CN=global-binduser,OU=Management,OU=GLOBAL,DC=linuxmuster,DC=lan' \
            --client-subnet 10.0.0.0/16 \
            --ssid 'lehrer-wlan:role-teacher:20' \
            --ssid 'schueler-wlan:role-student:10' \
            --join-secret join.authfile \
            --ldap-bind-secret ldap-bind.secret \
            --radius-secret radius.secret || true
          sudo test -f /var/lib/linuxmuster-radius/instances/ci.yaml
          sudo test -f /var/lib/linuxmuster-radius/instance.d/ci/clients.conf
          sudo "$old_cli" cert issue ci --passphrase ci

          # Every python below runs with -P: this job checks the repository out, so
          # without it the working directory lands on sys.path and a module could be
          # imported from the SOURCE tree instead of from the installed package -- which
          # would make the version and DEFAULT_IMAGE assertions test the checkout, not
          # the upgrade.
          # The instance record is compared FIELD BY FIELD, never by checksum: the record
          # is written by the software, not by the admin. 7.3.1 legitimately added
          # `ldap_ca` to the model, so Store.put() adds the key on its first write after
          # the upgrade, and the postinst's update-all rewrites `image` (and rolls it
          # back) when the .deb pins a new data-plane digest. What must survive untouched
          # are the keys the admin passed on the command line. Whoever adds such a key
          # extends this list in the same PR.
          cat > record.py <<'PY'
          import json
          import sys

          import yaml

          KEYS = [
              "name", "realm", "workgroup", "server_fqdn",
              "ldap_server", "ldap_base_dn", "ldap_bind_dn", "wifi_group",
              "client_subnets", "ssids",
              "join_secret", "ldap_bind_secret", "radius_secret",
          ]
          with open("/var/lib/linuxmuster-radius/instances/ci.yaml", encoding="utf-8") as fh:
              record = yaml.safe_load(fh)
          json.dump({k: record.get(k) for k in KEYS}, sys.stdout, sort_keys=True, indent=2)
          print()
          PY

          # Admin-owned files: config.yml (carries the API token), the secrets, the EAP
          # CA + server cert and the rendered instance.d configs.
          sudo bash -c 'find /etc/linuxmuster-radius/config.yml /etc/linuxmuster-radius/secrets \
                             /etc/linuxmuster-radius/certs /var/lib/linuxmuster-radius/instance.d \
                             -type f | sort | xargs -r sha256sum' > before.sha256
          # A manifest that ran empty would pass `sha256sum -c` while proving nothing:
          # without -r, xargs runs sha256sum once with NO arguments, it hashes stdin and
          # `-c` then reports "-: OK" with exit 0. So the manifest is pinned to exactly
          # the 11 files the fixture above creates -- a renamed path or a fixture that
          # silently did not run fails here instead of passing green.
          test -s before.sha256
          test "$(wc -l < before.sha256)" -eq 11
          grep -q ' /etc/linuxmuster-radius/config.yml$' before.sha256
          sudo find /etc/linuxmuster-radius /var/lib/linuxmuster-radius/instance.d \
               -printf '%m %U:%G %p\n' | sort > before.perms
          sudo /opt/linuxmuster-radius/venv/bin/python -P record.py > before.record
          sudo cp /var/lib/linuxmuster-radius/instances/ci.yaml before-raw.yaml
          cat before.sha256 before.perms before.record
          before_pid="$(systemctl show -p MainPID --value linuxmuster-radius.service)"

          # ---------------------------------------------------------------- the upgrade
          # --reinstall --allow-downgrades: on main the build is often version-equal to
          # the release, and a plain install would report "already the newest version"
          # and test nothing. With it dpkg unpacks over the installed version and sets
          # $2 in the postinst, so the upgrade branches really run.
          upgrade_since="$(date '+%Y-%m-%d %H:%M:%S')"
          sudo apt-get install -y --reinstall --allow-downgrades ./packages/*.deb 2>&1 | tee upgrade.log

          # The upgrade path really ran and did not silently no-op. Two independent
          # proofs: dpkg unpacked OVER the installed version, and the service was
          # restarted -- prerm deliberately leaves it running on upgrade, and the only
          # thing that restarts it is `systemctl try-restart` inside the postinst's
          # `if [ -n "${2:-}" ]` branch, which exists only when dpkg passes an old version.
          grep -qE 'Unpacking linuxmuster-radius \([^)]+\) over \([^)]+\)' upgrade.log
          # dpkg's own record of the action, independent of apt's wording.
          grep -q ' upgrade linuxmuster-radius:' /var/log/dpkg.log
          after_pid="$(systemctl show -p MainPID --value linuxmuster-radius.service)"
          echo "postinst upgrade branch ran: MainPID $before_pid -> $after_pid"
          test "$before_pid" != "$after_pid"
          # ... and update-all, the second thing that branch does, reached the instance.
          # Its outcome is deliberately NOT asserted (the container cannot become healthy
          # without a DC, the postinst rolls it back and ignores the result) -- only that
          # the upgrade path got that far.
          sudo journalctl -u linuxmuster-radius.service --since "$upgrade_since" --no-pager \
            | grep -q 'audit:update start name=ci'

          # ---------------------------------------------------------------- state AFTER
          for _ in $(seq 1 30); do sudo lmnradius health >/dev/null 2>&1 && break; sleep 1; done
          sudo lmnradius health

          # config.yml, secrets, certs and instance.d byte-identical.
          sudo sha256sum -c before.sha256
          # Permissions and ownership unchanged (secrets/ and certs/ 0700, the secrets
          # and every private key 0600, everything lmnradius:lmnradius).
          sudo find /etc/linuxmuster-radius /var/lib/linuxmuster-radius/instance.d \
               -printf '%m %U:%G %p\n' | sort > after.perms
          diff -u before.perms after.perms
          # The instance record, field by field.
          sudo /opt/linuxmuster-radius/venv/bin/python -P record.py > after.record
          diff -u before.record after.record
          # Not an assertion, a record: what the software itself rewrote in the instance
          # file. 7.3.1 added `ldap_ca` and update-all rewrites `image` (and rolls it
          # back), so across a version jump this diff is legitimately non-empty. It is
          # printed so that a newly added field is NOTICED and gets into the key list
          # above in the same PR instead of silently escaping the comparison.
          sudo cp /var/lib/linuxmuster-radius/instances/ci.yaml after-raw.yaml
          diff -u before-raw.yaml after-raw.yaml || echo "(instance record rewritten by the software, see above)"

          # The fixture image must not be this package's default -- see above: otherwise
          # update-all skips the instance and the upgrade path is never exercised.
          test "$fixture_image" != "$(sudo /opt/linuxmuster-radius/venv/bin/python -P -c 'from lmnradius.models import DEFAULT_IMAGE; print(DEFAULT_IMAGE)')"

          # The service survived enabled and running, and the CLI is on PATH.
          test "$(systemctl is-enabled linuxmuster-radius.service)" = enabled
          test "$(systemctl is-active linuxmuster-radius.service)" = active
          test "$(command -v lmnradius)" = /usr/bin/lmnradius

          # One version source: the venv metadata equals the dpkg version (~rc -> rc).
          ver="$(dpkg-query -W -f='${Version}' linuxmuster-radius)"
          pep="${ver//\~/}"
          test "$(sudo /opt/linuxmuster-radius/venv/bin/python -P -c 'from importlib.metadata import version; print(version("lmnradius"))')" = "$pep"

          # No leftovers of the old version under /opt: nothing dpkg does not own, only
          # the new lmnradius dist-info, only cpython-312 bytecode, nothing world-writable.
          dpkg -L linuxmuster-radius | grep '^/opt' | sort > opt-from-dpkg.txt
          sudo find /opt/linuxmuster-radius | sort > opt-on-disk.txt
          comm -13 opt-from-dpkg.txt opt-on-disk.txt > opt-leftovers.txt
          cat opt-leftovers.txt
          test ! -s opt-leftovers.txt
          test "$(sudo find /opt/linuxmuster-radius -name 'lmnradius-*.dist-info' -printf '%f\n' | sort -u)" = "lmnradius-$pep.dist-info"
          test -z "$(sudo find /opt/linuxmuster-radius -name '*.pyc' ! -name '*.cpython-312.pyc' -print -quit)"
          # Symlinks are always lrwxrwxrwx and chmod cannot change that, so only files
          # and directories are checked (the venv ships four: bin/python, bin/python3,
          # bin/python3.12, lib64).
          test "$(sudo find /opt/linuxmuster-radius \( -type f -o -type d \) -perm -0002 | wc -l)" = 0

          # dpkg/apt consistent. dpkg --verify is only a real check with md5sums; up to
          # 7.3.0 the package shipped none, so assert they are there before trusting it.
          test -z "$(dpkg --audit)"
          sudo apt-get -f install -s | grep -q '0 newly installed'
          test -s /var/lib/dpkg/info/linuxmuster-radius.md5sums
          test -z "$(sudo dpkg --verify linuxmuster-radius)"
      - name: Journal of the control plane (always, for the record)
        if: always() && steps.prev.outputs.skip != '1'
        run: sudo journalctl -u linuxmuster-radius.service --no-pager | tail -60 || true
