# Fast tier: control-plane lint/type/unit + shell + license compliance.
# (The heavy Kerberos + docker-py FreeRADIUS E2E runs on crabbox, not in GitHub CI.)
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The gate tools are PINNED on purpose: an unpinned `pip install ruff` picks up
      # whatever released last, and a linter that widens its default rule set turns the
      # pipeline red without a single line of our code changing (exactly what happened
      # on 2026-08-04). Pinned == the developer's local result == CI's result. Renovate
      # proposes bumps as PRs, so upgrading stays a deliberate, reviewed step.
      - name: Install control-plane + tools
        run: |
          pip install \
            ruff==0.15.21 \
            mypy==2.2.0 \
            reuse==6.2.0 \
            pytest==9.1.1 \
            pytest-asyncio httpx types-PyYAML cryptography ./controlplane
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy --config-file controlplane/pyproject.toml controlplane/lmnradius
      - name: pytest
        run: pytest -q controlplane/tests
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning \
            image/*.sh scripts/*.sh packaging/*.sh \
            packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm
      - name: reuse (license compliance)
        run: reuse lint
